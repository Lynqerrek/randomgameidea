<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Game Idea Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --sun:#FFD93D;
  --coral:#FF6B6B;
  --mint:#6BCB77;
  --sky:#4ECDC4;
  --lavender:#C77DFF;
  --peach:#FF9A3C;
  --pink:#FF6EB4;
  --blue:#4D96FF;
  --bg:#12141D;
  --white:#1E212B;
  --card:#1E212B;
  --text:#F0F0F5;
  --muted:#9AA0A6;
  --border:#2A2D3E;
  --shadow:rgba(0,0,0,0.4);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── floating blobs bg ── */
.blob-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.18;animation:blobFloat 8s ease-in-out infinite;}
.blob1{width:400px;height:400px;background:var(--lavender);top:-100px;left:-100px;animation-delay:0s;}
.blob2{width:350px;height:350px;background:var(--sky);top:30%;right:-80px;animation-delay:2s;}
.blob3{width:300px;height:300px;background:var(--sun);bottom:-80px;left:20%;animation-delay:4s;}
.blob4{width:250px;height:250px;background:var(--coral);bottom:10%;right:10%;animation-delay:6s;}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-20px) scale(1.05);}}

/* ── layout ── */
.page{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:2rem 1.5rem 5rem;}

/* ── header ── */
header{text-align:center;padding:2.5rem 0 2rem;}
.logo{font-size:3rem;display:inline-block;animation:spin3d 0.6s ease;margin-bottom:0.5rem;}
@keyframes spin3d{from{transform:rotateY(-90deg);}to{transform:rotateY(0deg);}}
h1{font-family:'Fredoka',sans-serif;font-size:clamp(2.4rem,6vw,3.8rem);font-weight:700;line-height:1.1;color:var(--text);letter-spacing:-0.01em;}
h1 span{background:linear-gradient(135deg,var(--coral),var(--lavender));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{font-size:1rem;color:var(--muted);margin-top:0.5rem;font-weight:600;}
.pill-stat{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:2px solid var(--border);border-radius:50px;padding:6px 14px;font-size:0.8rem;font-weight:700;color:var(--muted);margin:0.6rem 0.3rem;box-shadow:0 2px 8px var(--shadow);}
.pill-stat b{color:var(--text);}

/* ── nav tabs ── */
.tabs{display:flex;justify-content:center;gap:8px;margin:1.2rem 0;}
.tab{padding:0.55rem 1.4rem;border-radius:50px;border:2.5px solid var(--border);background:var(--white);font-family:'Fredoka',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.18s cubic-bezier(.34,1.56,.64,1);color:var(--muted);box-shadow:0 2px 6px var(--shadow);}
.tab:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 16px var(--shadow);}
.tab.active{background:var(--coral);border-color:var(--coral);color:#12141D;box-shadow:0 4px 16px rgba(255,107,107,0.25);}
.tab.fav-tab.active{background:var(--pink);border-color:var(--pink);color:#12141D;box-shadow:0 4px 16px rgba(255,110,180,0.25);}
.tab.spot-tab.active{background:var(--lavender);border-color:var(--lavender);color:#12141D;box-shadow:0 4px 16px rgba(199,125,255,0.25);}
.fav-count{background:rgba(0,0,0,0.3);border-radius:50px;padding:1px 7px;font-size:0.75rem;margin-left:4px;color:#FFF;}

/* ── controls bar ── */
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:1rem 0 1.4rem;}
.btn{padding:0.6rem 1.4rem;border-radius:50px;border:2.5px solid transparent;font-family:'Fredoka',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.18s cubic-bezier(.34,1.56,.64,1);display:inline-flex;align-items:center;gap:6px;}
.btn:hover{transform:translateY(-2px) scale(1.04);}
.btn:active{transform:scale(0.96);}
.btn-shuffle{background:var(--sun);color:#12141D;border-color:var(--sun);box-shadow:0 4px 14px rgba(255,217,61,0.2);}
.btn-shuffle:hover{box-shadow:0 7px 20px rgba(255,217,61,0.3);}
.btn-outline{background:var(--white);color:var(--text);border-color:var(--border);box-shadow:0 2px 8px var(--shadow);}
.btn-outline:hover{border-color:var(--sky);color:var(--sky);}
.btn-outline.active{background:var(--sky);border-color:var(--sky);color:#12141D;box-shadow:0 4px 14px rgba(78,205,196,0.25);}

.search-wrap{position:relative;display:flex;align-items:center;}
.search-wrap input{padding:0.6rem 1.2rem 0.6rem 2.6rem;border-radius:50px;border:2.5px solid var(--border);background:var(--white);font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:600;color:var(--text);width:220px;outline:none;box-shadow:0 2px 8px var(--shadow);transition:border-color 0.15s,box-shadow 0.15s;}
.search-wrap input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(78,205,196,0.15);}
.search-wrap input::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:10px;font-size:1rem;pointer-events:none;}

/* ── genre filter pills ── */
.genre-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:1.5rem;}
.gpill{padding:5px 14px;border-radius:50px;border:2px solid var(--border);background:var(--white);font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.15s cubic-bezier(.34,1.56,.64,1);color:var(--muted);box-shadow:0 2px 6px var(--shadow);}
.gpill:hover{transform:scale(1.06);}
.gpill.on{color:#12141D;border-color:transparent;transform:scale(1.06);}

/* ── count toggle ── */
.count-row{display:flex;gap:6px;justify-content:center;margin-bottom:1.5rem;}
.cnt-btn{padding:5px 16px;border-radius:50px;border:2px solid var(--border);background:var(--white);font-size:0.82rem;font-weight:800;cursor:pointer;transition:all 0.15s;color:var(--muted);}
.cnt-btn.on{background:var(--text);color:var(--bg);border-color:var(--text);}

/* ── cards grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.1rem;}

.card{
  background:var(--white);
  border-radius:20px;
  border:2.5px solid var(--border);
  padding:1.3rem 1.4rem;
  position:relative;
  transition:transform 0.2s cubic-bezier(.34,1.56,.64,1),box-shadow 0.2s ease,border-color 0.15s;
  cursor:default;
  box-shadow:0 3px 12px var(--shadow);
  animation:cardPop 0.35s cubic-bezier(.34,1.56,.64,1) both;
  content-visibility: auto; /* Culls off-screen items for massive performance boost */
  contain-intrinsic-size: 300px;
}
.card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 12px 30px rgba(0,0,0,0.3);border-color:rgba(255,255,255,0.1);}
.card.pinned{border-color:var(--sky);box-shadow:0 0 20px rgba(78,205,196,0.25);}

@keyframes cardPop{
  from{opacity:0;transform:scale(0.85) translateY(12px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}

.card-accent{height:5px;border-radius:50px;margin-bottom:1rem;}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:0.6rem;}
.card-title{font-family:'Fredoka',sans-serif;font-size:1.18rem;font-weight:600;line-height:1.25;flex:1;}
.card-actions{display:flex;gap:5px;flex-shrink:0;}
.icon-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all 0.15s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 4px var(--shadow);}
.icon-btn:hover{transform:scale(1.2);}
.icon-btn.faved{background:rgba(255,110,180,0.15);border-color:var(--pink);animation:heartPop 0.3s cubic-bezier(.34,1.56,.64,1);}
.icon-btn.copied{background:rgba(107,203,119,0.15);border-color:var(--mint);}
@keyframes heartPop{0%{transform:scale(1);}50%{transform:scale(1.4);}100%{transform:scale(1);}}

.active-project{
  background:var(--card); border:2px solid var(--sky); border-radius:16px;
  padding:1rem 1.5rem; margin:0 auto 1.5rem auto; max-width:600px;
  display:flex; justify-content:space-between; align-items:center;
  box-shadow:0 4px 20px rgba(78,205,196,0.15); animation:cardPop 0.3s ease;
}
.active-project-text{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--text);font-size:1.1rem;}
.active-project-text span{color:var(--sky);}

.card-desc{font-size:0.86rem;color:var(--muted);line-height:1.6;font-weight:600;margin-bottom:0.85rem;}

.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{padding:3px 10px;border-radius:50px;font-size:0.72rem;font-weight:800;letter-spacing:0.02em;}
.t-genre{background:rgba(224,85,85,0.15);color:#FF8888;}
.t-mechanic{background:rgba(58,123,213,0.15);color:#70A4FF;}
.t-setting{background:rgba(46,125,79,0.15);color:#66CC99;}
.t-mood{background:rgba(176,120,0,0.15);color:#FFC44D;}
.t-artstyle{background:rgba(139,69,204,0.15);color:#C488FF;}
.t-players{background:rgba(26,140,132,0.15);color:#4DEBE0;}

/* ── card number ── */
.card-num{position:absolute;top:12px;right:12px;font-size:0.68rem;font-weight:800;color:var(--muted);opacity:0.4;font-family:'Fredoka',sans-serif;}

/* ── spotlight mode ── */
#spotlight-view{display:none;}
.spotlight-wrap{max-width:560px;margin:0 auto;text-align:center;}
.spot-card{
  background:var(--white);
  border-radius:28px;
  border:3px solid var(--border);
  padding:2.5rem 2.8rem;
  box-shadow:0 16px 50px rgba(0,0,0,0.4);
  position:relative;
  margin-bottom:1.5rem;
}
.spot-accent{height:8px;border-radius:50px;margin-bottom:1.5rem;}
.spot-title{font-family:'Fredoka',sans-serif;font-size:2rem;font-weight:700;margin-bottom:0.8rem;line-height:1.2;}
.spot-desc{font-size:0.95rem;color:var(--muted);line-height:1.7;font-weight:600;margin-bottom:1.3rem;}
.spot-tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:1.5rem;}
.spot-actions{display:flex;gap:10px;justify-content:center;}
.spot-card{animation:spotIn 0.4s cubic-bezier(.34,1.56,.64,1);}
@keyframes spotIn{from{opacity:0;transform:scale(0.88) rotate(-1deg);}to{opacity:1;transform:scale(1) rotate(0deg);}}

.spot-counter{font-family:'Fredoka',sans-serif;font-size:0.9rem;color:var(--muted);margin-bottom:1rem;}
.spot-nav{display:flex;gap:12px;justify-content:center;margin-bottom:1rem;}
.btn-big{padding:0.8rem 2rem;font-size:1.1rem;border-radius:50px;border:none;font-family:'Fredoka',sans-serif;font-weight:600;cursor:pointer;transition:all 0.18s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 14px var(--shadow);}
.btn-big:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 22px var(--shadow);}
.btn-big:active{transform:scale(0.97);}

/* ── favorites empty ── */
.fav-empty{text-align:center;padding:4rem 1rem;color:var(--muted);}
.fav-empty .big-emoji{font-size:4rem;display:block;margin-bottom:1rem;animation:wobble 2s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
.fav-empty p{font-size:1rem;font-weight:700;}

/* ── showing label ── */
.showing{text-align:center;font-size:0.82rem;font-weight:700;color:var(--muted);margin:1rem 0 0.5rem;}

/* ── empty state ── */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:0.95rem;font-weight:700;}
.empty span{font-size:2.5rem;display:block;margin-bottom:0.5rem;}

/* ── bounce shuffle btn ── */
.shuffling{animation:bigBounce 0.5s cubic-bezier(.34,1.56,.64,1);}
@keyframes bigBounce{0%{transform:scale(1);}30%{transform:scale(0.88);}70%{transform:scale(1.1);}100%{transform:scale(1);}}

/* ── toast ── */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:0.6rem 1.4rem;border-radius:50px;font-size:0.85rem;font-weight:700;z-index:1000;transition:transform 0.3s cubic-bezier(.34,1.56,.64,1);}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:600px){.page{padding:1rem 1rem 4rem;}.spot-card{padding:1.8rem 1.5rem;}.spot-title{font-size:1.5rem;}}
</style>
</head>

    <div class="showing" id="showing-label"></div>
    <div class="grid" id="cards"></div>
  </div>

  <!-- spotlight view -->
  <div id="spotlight-view">
    <div class="spotlight-wrap">
      <div class="spot-counter" id="spot-counter"></div>
      <div id="spot-card-wrap"></div>
      <div class="spot-nav">
        <button class="btn-big" style="background:#2A2D3E;color:#F0F0F5;" onclick="spotNav(-1)">← Prev</button>
        <button class="btn-big" style="background:var(--lavender);color:#12141D;" onclick="spotRandom()">🎲 Random</button>
        <button class="btn-big" style="background:#2A2D3E;color:#F0F0F5;" onclick="spotNav(1)">Next →</button>
      </div>
    </div>
  </div>

  <!-- favorites view -->
  <div id="fav-view" style="display:none">
    <div id="fav-cards"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  "multiplayer": ["co-op", "multiplayer", "players", "👥"],
  "friends": ["co-op", "multiplayer", "players", "2-4", "up to 6"],
  "coop": ["co-op", "multiplayer", "players", "2-4", "up to 6"],
  "co-op": ["co-op", "multiplayer", "players", "2-4", "up to 6"],
  "solo": ["solo"]
};

function rng(s,max){let x=Math.sin(s+1)*10000;return Math.floor((x-Math.floor(x))*max);}

function makeIdea(idx,seed){
  const s=idx*7919+seed*9973+31337;
  const genre=GENRES[rng(s,GENRES.length)];
  const mechanic=MECHANICS[rng(s+1,MECHANICS.length)];
  const setting=SETTINGS[rng(s+2,SETTINGS.length)];
  const twist=TWISTS[rng(s+3,TWISTS.length)];
  const hook=HOOKS[rng(s+4,HOOKS.length)];
  const mood=MOODS[rng(s+5,MOODS.length)];
  const art=ART_STYLES[rng(s+6,ART_STYLES.length)];
  const players=PLAYERS[rng(s+7,PLAYERS.length)];
  const accent=ACCENTS[rng(s+8,ACCENTS.length)];
  const a1=ADJ[rng(s+9,ADJ.length)],n1=NOUN[rng(s+10,NOUN.length)];
  const a2=ADJ[rng(s+11,ADJ.length)],n2=NOUN[rng(s+12,NOUN.length)];
  const titles=[`${a1} ${n1}`,`The ${a2} ${n2}`,`${n1} of ${a2} ${n2}`,`Project ${n1.toUpperCase()}`,`${a1} ${n2}: ${a2} ${n1}`];
  const title=titles[rng(s+13,titles.length)];
  const openers=["A "+genre.toLowerCase()+" set in a "+setting.toLowerCase(),"Deep within a "+setting.toLowerCase()+", this "+genre.toLowerCase(),"In the heart of a "+setting.toLowerCase()+", a "+genre.toLowerCase(),"Experience a "+setting.toLowerCase()+" through the lens of this "+genre.toLowerCase(),"This "+genre.toLowerCase()+" drops you into a "+setting.toLowerCase()];
  const mids=["where "+mechanic.toLowerCase()+" shapes every single choice","built entirely around "+mechanic.toLowerCase(),"using "+mechanic.toLowerCase()+" in ways never seen before","where "+mechanic.toLowerCase()+" becomes your most powerful tool","that redefines what "+mechanic.toLowerCase()+" can mean"];
  const ends=["— "+twist.toLowerCase()+".","with one jaw-dropping twist: "+twist.toLowerCase()+".","until everything flips: "+twist.toLowerCase()+".","hiding its greatest secret — "+twist.toLowerCase()+"."];
  const o=openers[rng(s+14,openers.length)],m=mids[rng(s+15,mids.length)],e=ends[rng(s+16,ends.length)];
  const desc=o+" "+m+e+" A game "+hook+".";
  return{id:idx+1,title,genre,mechanic,setting,twist,mood,art,players,accent,desc};
}

// ─── STATE ──────────────────────────────────────────────────────────────────
const TOTAL=4096;
let ideas=[],favorites=new Set(),seed=0,activeGenre=null,showFavOnly=false,displayCount=6,currentTab='grid',spotIdx=0;
let pinnedIdeaId=null, currentLimit=48;
const CHUNK_SIZE=48;

const observer = new IntersectionObserver((entries) => {
  if(entries[0].isIntersecting && currentTab === 'grid' && displayCount === 'all') {
    loadMore();
  }
}, { rootMargin: '400px' });

function build(){ideas=[];for(let i=0;i<TOTAL;i++)ideas.push(makeIdea(i,seed));}

// Smart Search Implementation
function checkSearchMatch(idea, tokens) {
  let isMatch = true;
  let totalScore = 0;
  
  for (let t of tokens) {
    let tokenMatched = false;
    let possibleMatches = [t, ...(SYNONYMS[t] || [])];
    
    // Simple Stemming: If word ends with 's' or 'ies', check singular as well
    if (t.endsWith('s') && t.length > 3) {
      possibleMatches.push(t.slice(0, -1));
    }
    if (t.endsWith('ies') && t.length > 4) {
      possibleMatches.push(t.slice(0, -3) + 'y');
    }
    
    for (let pm of possibleMatches) {
      let fields = [
        { text: idea.title.toLowerCase(), weight: 40 },
        { text: idea.genre.toLowerCase(), weight: 25 },
        { text: idea.mechanic.toLowerCase(), weight: 25 },
        { text: idea.setting.toLowerCase(), weight: 25 },
        { text: idea.mood.toLowerCase(), weight: 15 },
        { text: idea.art.toLowerCase(), weight: 15 },
        { text: idea.desc.toLowerCase(), weight: 10 },
        { text: idea.players.toLowerCase(), weight: 10 }
      ];
      
      for (let f of fields) {
        if (f.text.includes(pm)) {
          tokenMatched = true;
          // Exact word match bonus vs simple substring inclusion
          if (f.text === pm || f.text.split(/[\s,.:;!?()|👥]+/).includes(pm)) {
            totalScore += f.weight * 2;
          } else {
            totalScore += f.weight;
          }
        }
      }
    }
    // All original tokens must find at least one match (AND search style)
    if (!tokenMatched) {
      isMatch = false;
      break;
    }
  }
  return { isMatch, score: totalScore };
}

function filtered(){
  let list=ideas;
  if(activeGenre)list=list.filter(x=>x.genre===activeGenre);
  if(showFavOnly)list=list.filter(x=>favorites.has(x.id));
  
  const q=document.getElementById('search').value.toLowerCase().trim();
  if(q) {
    let tokens = q.split(/\s+/).filter(t => t.length > 0);
    if (tokens.length > 0) {
      let scoredList = [];
      for (let idea of list) {
        let matchResult = checkSearchMatch(idea, tokens);
        if (matchResult.isMatch) {
          scoredList.push({ idea: idea, score: matchResult.score });
        }
      }
      // Sort by score descending, preserving original ID ordering as a secondary sort
      scoredList.sort((a, b) => b.score - a.score || a.idea.id - b.idea.id);
      list = scoredList.map(x => x.idea);
    }
  }
  return list;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function cardHTML(idea,delay=0,big=false){
  const faved=favorites.has(idea.id);
  const isPinned=pinnedIdeaId===idea.id;
  return`<div class="card${isPinned?' pinned':''}" id="card-${idea.id}" style="animation-delay:${delay}s;${big?'animation:spotIn 0.4s cubic-bezier(.34,1.56,.64,1) both;':''}">
    <div class="card-accent" style="background:${idea.accent}"></div>
    <div class="card-top">
      <div class="card-title">${idea.title}</div>
      <div class="card-actions">
        <button class="icon-btn btn-pin${isPinned?' copied':''}" title="${isPinned?'Unpin Project':'Pin as Focus'}" onclick="togglePin(${idea.id})">📌</button>
        <button class="icon-btn${faved?' faved':''}" title="${faved?'Unfavorite':'Favorite'}" onclick="toggleFav(${idea.id},this)">
          ${faved?'❤️':'🤍'}
        </button>
        <button class="icon-btn" title="Copy idea" onclick="copyIdea(${idea.id},this)">📋</button>
      </div>
    </div>
    <p class="card-desc">${idea.desc}</p>
    <div class="tags">
      <span class="tag t-genre">${idea.genre}</span>
      <span class="tag t-mechanic">${idea.mechanic}</span>
      <span class="tag t-setting">${idea.setting}</span>
      <span class="tag t-mood">${idea.mood}</span>
      <span class="tag t-artstyle">${idea.art}</span>
      <span class="tag t-players">👥 ${idea.players}</span>
    </div>
  </div>`;
}

function render(){
  if(currentTab!=='grid')return;
  const list=filtered();
  const container=document.getElementById('cards');
  
  if(displayCount==='all') currentLimit=CHUNK_SIZE;
  else currentLimit=+displayCount;

  const toShow=list.slice(0, currentLimit);
  
  if(!toShow.length){
    container.innerHTML='<div class="empty"><span>🤷</span>No ideas found — try different filters!</div>';
    document.getElementById('showing-label').textContent='';
    return;
  }
  
  container.innerHTML=toShow.map((x,i)=>cardHTML(x,Math.min(i*0.02,0.3))).join('');
  
  if(displayCount==='all' && currentLimit<list.length) {
    const sentinel=document.createElement('div');
    sentinel.id='scroll-sentinel';
    sentinel.style.gridColumn='1 / -1';
    sentinel.style.height='10px';
    container.appendChild(sentinel);
    observer.observe(sentinel);
  }
  
  const n=Math.min(currentLimit, list.length);
  document.getElementById('showing-label').textContent=`Showing ${n} of ${list.length} ideas${activeGenre?' in '+activeGenre:''}`;
}

function loadMore() {
  const list=filtered();
  const container=document.getElementById('cards');
  const sentinel=document.getElementById('scroll-sentinel');
  if(sentinel) observer.unobserve(sentinel);
  
  const start=currentLimit;
  currentLimit+=CHUNK_SIZE;
  const toShow=list.slice(start, currentLimit);
  
  const temp=document.createElement('div');
  temp.innerHTML=toShow.map(x=>cardHTML(x,0)).join('');
  
  while(temp.firstChild) container.insertBefore(temp.firstChild, sentinel);
  
  if(currentLimit<list.length && sentinel) observer.observe(sentinel);
  else if(sentinel) sentinel.remove();
  
  const n=Math.min(currentLimit, list.length);
  document.getElementById('showing-label').textContent=`Showing ${n} of ${list.length} ideas${activeGenre?' in '+activeGenre:''}`;
}

function renderFavs(){
  const container=document.getElementById('fav-cards');
  const favList=ideas.filter(x=>favorites.has(x.id));
  if(!favList.length){
    container.innerHTML='<div class="fav-empty"><span class="big-emoji">🤍</span><p>No favorites yet! Heart some ideas from the main grid.</p></div>';
    return;
  }
  container.innerHTML='<div class="grid">'+favList.map((x,i)=>cardHTML(x,Math.min(i*0.04,0.5))).join('')+'</div>';
}

function renderSpot(){
  const list=filtered().length?filtered():ideas;
  if(spotIdx>=list.length)spotIdx=0;
  const idea=list[spotIdx];
  document.getElementById('spot-counter').textContent=`Idea ${spotIdx+1} of ${list.length}`;
  document.getElementById('spot-card-wrap').innerHTML=`
    <div class="spot-card">
      <div class="spot-accent" style="background:linear-gradient(90deg,${idea.accent},${ACCENTS[(ACCENTS.indexOf(idea.accent)+3)%ACCENTS.length]})"></div>
      <div class="spot-title">${idea.title}</div>
      <p class="spot-desc">${idea.desc}</p>
      <div class="spot-tags">
        <span class="tag t-genre">${idea.genre}</span>
        <span class="tag t-mechanic">${idea.mechanic}</span>
        <span class="tag t-setting">${idea.setting}</span>
        <span class="tag t-mood">${idea.mood}</span>
        <span class="tag t-artstyle">${idea.art}</span>
        <span class="tag t-players">👥 ${idea.players}</span>
      </div>
      <div class="spot-actions">
        <button class="btn-big" style="background:${pinnedIdeaId===idea.id?'var(--sky)':'#2A2D3E'};color:${pinnedIdeaId===idea.id?'#12141D':'#F0F0F5'};" onclick="togglePin(${idea.id})">
          ${pinnedIdeaId===idea.id?'📌 Focused':'📌 Set Focus'}
        </button>
        <button class="btn-big" style="background:${favorites.has(idea.id)?'rgba(255,110,180,0.15)':idea.accent};color:${favorites.has(idea.id)?'#FF6EB4':'#12141D'}; border: 2px solid ${favorites.has(idea.id)?'#FF6EB4':'transparent'};" onclick="toggleFavSpot(${idea.id})">
          ${favorites.has(idea.id)?'❤️ Saved':'🤍 Save Idea'}
        </button>
        <button class="btn-big" style="background:var(--border);color:var(--text);" onclick="copyIdea(${idea.id},null)">📋 Copy</button>
      </div>
    </div>`;
}

function spotNav(dir){
  const list=filtered().length?filtered():ideas;
  spotIdx=(spotIdx+dir+list.length)%list.length;
  renderSpot();
}
function spotRandom(){
  const list=filtered().length?filtered():ideas;
  spotIdx=Math.floor(Math.random()*list.length);
  renderSpot();
}

// ─── INTERACTIONS ────────────────────────────────────────────────────────────
function togglePin(id) {
  if(pinnedIdeaId===id) pinnedIdeaId=null;
  else pinnedIdeaId=id;
  
  renderBanner();
  
  // Update DOM seamlessly without losing scroll position
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('pinned'));
  document.querySelectorAll('.btn-pin').forEach(b=>{
    b.title='Pin as Focus';
    b.classList.remove('copied');
  });

  if(pinnedIdeaId) {
    document.querySelectorAll(`#card-${pinnedIdeaId}`).forEach(c=>{
      c.classList.add('pinned');
      const btn=c.querySelector('.btn-pin');
      if(btn) { btn.title='Unpin Project'; btn.classList.add('copied'); }
    });
  }
  
  if(currentTab==='spot') renderSpot();
}

function renderBanner() {
  const wrap = document.getElementById('active-project-wrap');
  if(!pinnedIdeaId) { wrap.innerHTML=''; return; }
  
  const idea = ideas.find(x=>x.id===pinnedIdeaId);
  wrap.innerHTML = `
    <div class="active-project">
      <div class="active-project-text">📌 Focused Project: <span>${idea.title}</span></div>
      <button class="btn btn-outline" style="padding:0.3rem 0.8rem; font-size:0.85rem;" onclick="togglePin(${idea.id})">Clear Focus</button>
    </div>
  `;
}

function toggleFav(id,btn){
  if(favorites.has(id)){favorites.delete(id);btn.innerHTML='🤍';btn.classList.remove('faved');}
  else{favorites.add(id);btn.innerHTML='❤️';btn.classList.add('faved');}
  updateFavCount();
}
function toggleFavSpot(id){
  if(favorites.has(id))favorites.delete(id);
  else favorites.add(id);
  updateFavCount();
  renderSpot();
}
function updateFavCount(){
  const n=favorites.size;
  document.getElementById('fav-badge').textContent=n;
  document.getElementById('stat-favs').textContent=n;
  const stat=document.getElementById('fav-stat');
  stat.style.display=n>0?'':'none';
}

function copyIdea(id,btn){
  const idea=ideas.find(x=>x.id===id);
  const text=`${idea.title}\n\n${idea.desc}\n\nGenre: ${idea.genre} | Mechanic: ${idea.mechanic} | Setting: ${idea.setting} | Mood: ${idea.mood} | Art: ${idea.art} | Players: ${idea.players}`;
  navigator.clipboard.writeText(text).catch(()=>{});
  if(btn){btn.innerHTML='✅';btn.classList.add('copied');setTimeout(()=>{btn.innerHTML='📋';btn.classList.remove('copied');},1500);}
  showToast('Idea copied to clipboard!');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function doShuffle(){
  seed=Math.floor(Math.random()*99999);
  build();
  const btn=document.getElementById('shuffle-btn');
  btn.classList.remove('shuffling');void btn.offsetWidth;btn.classList.add('shuffling');
  if(currentTab==='grid')render();
  else if(currentTab==='spot'){spotIdx=0;renderSpot();}
  showToast('🎲 Fresh ideas loaded!');
}

function toggleFavOnly(){
  showFavOnly=!showFavOnly;
  document.getElementById('fav-only-btn').classList.toggle('active',showFavOnly);
  render();
}

function setCount(n){
  displayCount=n;
  document.querySelectorAll('.cnt-btn').forEach(b=>{b.classList.toggle('on',b.dataset.n==n||(n==='all'&&b.dataset.n==='all'));});
  render();
}

function switchTab(tab){
  currentTab=tab;
  document.getElementById('grid-view').style.display=tab==='grid'?'block':'none';
  document.getElementById('spotlight-view').style.display=tab==='spot'?'block':'none';
  document.getElementById('fav-view').style.display=tab==='fav'?'block':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.classList.toggle('active',['grid','spot','fav'][i]===tab);
  });
  if(tab==='fav')renderFavs();
  if(tab==='spot')renderSpot();
}

// ─── GENRE PILLS ────────────────────────────────────────────────────────────
const GENRE_COLORS=["#FF6B6B","#FF9A3C","#FFD93D","#6BCB77","#4ECDC4","#4D96FF","#C77DFF","#FF6EB4","#A0C4FF","#CAFFBF"];
function buildGenrePills(){
  const row=document.getElementById('genre-row');
  row.innerHTML = ''; // Clear prior if any
  GENRES.forEach((g,i)=>{
    const btn=document.createElement('button');
    btn.className='gpill';btn.textContent=g;
    btn.style.setProperty('--gc',GENRE_COLORS[i%GENRE_COLORS.length]);
    btn.onclick=()=>{
      if(activeGenre===g){activeGenre=null;btn.classList.remove('on');btn.style.background='';btn.style.color='';}
      else{
        activeGenre=g;
        document.querySelectorAll('.gpill').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.color='';});
        btn.classList.add('on');btn.style.background=GENRE_COLORS[i%GENRE_COLORS.length];btn.style.borderColor=GENRE_COLORS[i%GENRE_COLORS.length];
      }
      render();
    };
    row.appendChild(btn);
  });
}

// ─── INIT ────────────────────────────────────────────────────────────────────
// Dynamically configure stats values to perfectly reflect expanded array limits
document.getElementById('stat-genres').textContent = GENRES.length;
document.getElementById('stat-mechanics').textContent = MECHANICS.length;
document.getElementById('stat-settings').textContent = SETTINGS.length;

build();
buildGenrePills();
render();
</script>
</body>
</html>
